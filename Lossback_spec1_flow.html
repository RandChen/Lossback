<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotion Suite Phase 2：Lossback</title>
<style>
:root{
  --paper:#F3F5F7;
  --card:#FFFFFF;
  --ink:#12263A;
  --muted:#5B6B7B;
  --line:#8796A5;
  --rule:#D9DFE5;
  --green:#12805C;
  --amber:#B87414;
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #1B6FD1;outline-offset:2px}

header{position:relative;z-index:30;background:var(--paper);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:22px 32px 0;flex-wrap:wrap}
h1{margin:0;font-size:26px;line-height:1.3;font-weight:800;letter-spacing:.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 18px;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tab:hover{color:var(--ink)}

.hint{margin:14px 32px 10px;color:var(--muted);font-size:14px}
.hint kbd{font-family:inherit;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:0 6px;font-size:13px}

/* Flow */
.flow-wrap{overflow-x:auto;padding:0 32px 8px}
.flow{position:relative;display:grid;grid-template-columns:150px repeat(9,minmax(112px,1fr));min-width:1300px}
.band{grid-column:1 / -1;background:var(--card);border-radius:12px;margin:5px 0;border:1px solid var(--rule);z-index:0}
.lane-label{grid-column:1;z-index:1;display:flex;flex-direction:column;justify-content:center;margin:5px 0;padding:0 12px 0 16px;border-left:5px solid var(--lc);border-radius:12px 0 0 12px}
.lane-label b{font-size:15px;line-height:1.35}
.lane-label span{font-size:12px;color:var(--muted);line-height:1.35}
.node{z-index:2;align-self:center;justify-self:stretch;margin:26px 12px;min-height:54px;padding:8px 8px;background:#fff;border:2px solid var(--lc);border-radius:8px;font-size:15px;font-weight:700;line-height:1.3;text-align:center;cursor:pointer;transition:background .15s,color .15s}
.node:hover{background:color-mix(in srgb,var(--lc) 12%,#fff)}
.node[aria-pressed="true"]{background:var(--lc);color:#fff}
.node.rule{border-style:dashed}
.node.decision{border-width:3px}
svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.legend{display:flex;gap:28px;margin:6px 32px 28px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.legend i{display:inline-block;width:34px;height:0;border-top:2px solid var(--line);vertical-align:middle;margin-right:8px}
.legend i.back{border-top:2px dashed var(--amber)}
.legend i.rl{border-top:2px dashed #3D4A57;width:22px}

/* Drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:#fff;box-shadow:-12px 0 40px rgba(18,38,58,.22);transform:translateX(104%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.d-head{padding:22px 28px 16px;border-bottom:1px solid var(--rule);position:relative}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--lc);color:#fff;font-size:13px;font-weight:700}
.d-head h2{margin:10px 40px 2px 0;font-size:26px;line-height:1.3}
.d-ref{color:var(--muted);font-size:14px}
.close{position:absolute;top:16px;right:18px;width:40px;height:40px;border:0;border-radius:8px;background:#EEF1F4;font-size:22px;line-height:1;cursor:pointer}
.close:hover{background:#E1E6EB}
.d-body{flex:1;overflow-y:auto;padding:18px 28px 28px}
.d-body h3{margin:20px 0 8px;font-size:16px}
.d-body h3:first-child{margin-top:0}
.d-body ul{margin:0;padding:0;list-style:none}
.d-body li{position:relative;padding:5px 0 5px 20px;font-size:17px}
.d-body li::before{content:"";position:absolute;left:3px;top:.95em;width:7px;height:7px;border-radius:2px;background:var(--lc)}
.example{margin:12px 0 0;padding:10px 14px;background:#F3F5F7;border-left:4px solid var(--line);border-radius:0 8px 8px 0;font-size:16px}
.example b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.next{margin:16px 0 0;padding:10px 14px;border:1.5px dashed var(--line);border-radius:8px;font-size:16px;color:#33414F}
.next b{display:inline-block;margin-right:8px;padding:0 8px;border-radius:4px;background:#E4E9EE;font-size:12px}
.linkbtn{margin-top:18px;padding:10px 16px;border:2px solid var(--green);background:#fff;color:var(--green);font-weight:700;font-size:15px;border-radius:8px;cursor:pointer}
.linkbtn:hover{background:var(--green);color:#fff}
.d-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;border-top:1px solid var(--rule);background:#FAFBFC}
.d-foot button{padding:9px 18px;border:1.5px solid var(--ink);background:#fff;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}
.d-foot button:hover:not(:disabled){background:var(--ink);color:#fff}
.d-foot button:disabled{opacity:.35;cursor:default}
.d-foot span{color:var(--muted);font-size:14px}

/* Rules view */
.rules{padding:22px 32px 40px;max-width:1280px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin:6px 0 20px}
.seg button{padding:10px 22px;border:0;background:#fff;font-size:16px;font-weight:700;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
.rtitle{margin:0 0 4px;font-size:22px}
.rdesc{margin:0 0 16px;color:var(--muted);font-size:15px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
th,td{padding:16px 20px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule);font-size:17px}
th{background:#E9EEF2;font-size:15px}
tr:last-child td{border-bottom:0}
td.scn{width:26%;font-weight:700}
td ol{margin:0;padding-left:22px}
td li{padding:2px 0}
.eg{color:var(--muted);font-size:15px}
.rnote{margin-top:16px;font-size:15px;color:var(--muted)}
.rnote button{border:0;background:none;color:#1B5FB8;font-size:15px;text-decoration:underline;cursor:pointer;padding:0}
.hidden{display:none}
.rules td:empty{padding:0}

@media (prefers-reduced-motion:reduce){.drawer{transition:none}.node{transition:none}}
@media (max-width:700px){header,.hint,.flow-wrap,.legend,.rules{padding-left:16px;padding-right:16px}.hint,.legend{margin-left:0;margin-right:0}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Promotion Suite Phase 2：Lossback</h1>
    <p class="sub">MVP 1 流程總覽</p>
  </div>
  <div class="tabs" role="tablist" aria-label="頁面">
    <button class="tab" role="tab" id="tab-flow" aria-selected="true" data-view="flow">流程總覽</button>
    <button class="tab" role="tab" id="tab-rules" aria-selected="false" data-view="rules">計算規則</button>
  </div>
</header>

<section id="view-flow">
  <p class="hint">點擊流程圖中的步驟，查看完整說明。說明開啟後，可用 <kbd>←</kbd> <kbd>→</kbd> 切換步驟，<kbd>Esc</kbd> 關閉。</p>
  <div class="flow-wrap">
    <div class="flow" id="flow"></div>
  </div>
  <div class="legend">
    <span><i></i>流程方向</span>
    <span><i class="back"></i>審核退回後重新編輯</span>
    <span><i class="rl"></i>虛線外框為排除規則</span>
  </div>
</section>

<section id="view-rules" class="rules hidden" aria-labelledby="tab-rules">
  <div id="rule-body"></div>
</section>

<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="d-title">
  <div class="d-head">
    <span class="pill" id="d-pill"></span>
    <h2 id="d-title"></h2>
    <div class="d-ref" id="d-ref"></div>
    <button class="close" id="d-close" aria-label="關閉說明">&times;</button>
  </div>
  <div class="d-body" id="d-body"></div>
  <div class="d-foot">
    <button id="d-prev">上一步</button>
    <span id="d-count"></span>
    <button id="d-next">下一步</button>
  </div>
</aside>

<script>
const LANES = [
  {id:'ops', name:'Saba Operations', sub:'Admin Site 後台', color:'#3D5A80'},
  {id:'lap', name:'Licensee / Saba AM', sub:'LAP 後台 - Promotion Suite', color:'#B87414'},
  {id:'mgr', name:'Manager審核', sub:'LAP 後台 - Promotion Suite', color:'#B87414'},
  {id:'calc', name:'Lossback calculator', sub:'條件判斷與結算', color:'#F2805C'},
  {id:'api', name:'Free bet API', sub:'派發與回收', color:'#F2805C'},
  {id:'mem', name:'Member Site', sub:'會員端', color:'#0E7C7B'},
  {id:'rep', name:'報表', sub:'LAP 後台 - Promotion Suite', color:'#B87414'}
];

const NODES = [
  {id:'O1', lane:'ops', col:2, label:'賽事開盤', ref:'文件章節 1.2　Create Trigger：Lossback', title:'賽事開盤',
   s:[{t:'list', items:['Match 狀態是 Operations 在 Admin site 有開盤']}]},

  {id:'L1', lane:'lap', col:1, label:'建立 Campaign', ref:'文件章節 1.1　Create Campaign', title:'建立 Campaign',
   s:[{t:'list', items:['設定 Campaign name（Internal 和 External，多語系）','設定 Period（Start time 至 End time）','新建 Trigger，並決定類型（例如 Early payout、Lossback、Bet challenge、Turnover）','一個 Campaign 僅能新增 1 個 Trigger','Campaign 可先儲存為草稿，之後再繼續編輯']},
      {t:'next', items:['一個 Campaign 最多能新增 10 個 Trigger']}]},
  {id:'L2', lane:'lap', col:2, label:'建立 Trigger', ref:'文件章節 1.2　Create Trigger：Lossback', title:'建立 Trigger：Lossback',
   s:[{t:'list', h:'賽事與 Licensee', items:['選取 Match：可挑單一Match（Match 狀態是 Operations 在 Admin site 有開盤）','選取 Licensee','Licensee 為自己創建 Trigger 時，只能選取自己','Saba AM 為多個 Licensee 創建 Trigger 時，可以選取多個 Licensee']},
      {t:'list', h:'依各個 Licensee 設定', items:['輸入 Trigger name（Internal 和 External）','輸入 Trigger 活動內容的描述','上傳 Trigger 的 banner','（Trigger name、描述、banner 均為多語系）','Lossback 只有一個級數：輸入各級的低消、回饋百分比、回饋 Freebet 上限','選取 User group：手動輸入或上傳 CSV','呈現 Freebet 的使用限制（例如：可用在哪些聯賽），可參考現有 Freebet 系統的做法']},
      {t:'rules', label:'查看計算規則'},
      {t:'next', items:['選取 Period：Start time 至 End time','選取 Bet type：Sport > League > match > bet type','建立 Lossback 分級，最多可以分 10 級','User group 整合 Saba intelligence 建議並匯入']}]},
  {id:'L3', lane:'lap', col:3, label:'預覽並送審', ref:'文件章節 1.4　Preview Campaign and submit for approval', title:'預覽 Campaign 並送審',
   s:[{t:'list', items:['待 Trigger 都建立好，需要 preview Campaign','T&C（多語系）需呈現不同 Licensee 的低消、回饋百分比、回饋 Freebet 上限','Preview 沒有問題，可以送出給 Manager 審核，狀態變為 In-Review']},
      {t:'next', items:['同一 Campaign 下，若有多個 Trigger，需要列出被加入 2 個（含以上）Trigger 的 User']}]},

  {id:'M1', lane:'mgr', col:4, label:'審核', decision:true, ref:'文件章節 1.4', title:'Manager 審核',
   s:[{t:'list', items:['審核不通過：需填寫理由，狀態變為 Rejected','Rejected 後，申請人可以按 edit 重新編輯，狀態變為 draft','審核通過：Campaign 即會依其條件進行']}]},
  {id:'M2', lane:'mgr', col:5, label:'Approved 生效', ref:'文件章節 1.4', title:'Approved 後生效',
   s:[{t:'list', items:['Campaign 審核通過，即會依其條件進行','不可再編輯內容或新增 Trigger']},
      {t:'list', h:'暫停與刪除', items:['Trigger 可以各別被暫停或刪除','Campaign 可以被暫停或刪除，並且影響此 Campaign 裡所有的 Trigger','Campaign 的 Start time 和 End time 也是所有 Trigger 的 Start time 和 End time']}]},

  {id:'N1', lane:'calc', col:4, label:'不適用注單', rule:true, ref:'文件章節 1.3', title:'以下注單不適用',
   s:[{t:'list', h:'Bet Type', items:['bet type id 9：Mix Parlay','bet type id 10：Outright','bet type id 29：System Parlay','BB+','468 Score Box Handicap（比分让球盘）','469 Score Box Over/Under（比分大小盘）']},
      {t:'list', h:'Bet slip status', items:['Multiple single bet','Parlay Bet / single bet of Via Lucky','SMP / Cash Out / Saba Coins Betting','Quick Bet']}]},
  {id:'C1', lane:'calc', col:5, label:'資格判斷', ref:'文件章節 2　Lossback calculator', title:'資格判斷',
   s:[{t:'note', text:'於現有系統上新增 Lossback 條件判斷及結算流程。'},
      {t:'list', items:['判斷注單、賽事、盤口、會員及活動是否符合資格']},
      {t:'goto', id:'N1', label:'查看不適用注單'}]},
  {id:'C2', lane:'calc', col:6, label:'Settle 達標', ref:'文件章節 2、1.2', title:'賽事 Settle 並達到 Lossback 條件',
   s:[{t:'list', items:['當賽事 Settle 時，達到 Lossback 條件，系統打 Freebet API 派發 Free bet','淨虧損 = 指定賽事之總有效投注額 - 總派彩金額（計算結果為負值）','門檻判定：淨虧損絕對值 ≥ 低消','回饋 Freebet = min(淨虧損絕對值 × 回饋百分比, 回饋 Freebet 上限)']},
      {t:'rules', label:'查看計算規則'}]},
  {id:'C3', lane:'calc', col:8, label:'防止重複觸發', ref:'文件章節 2　Lossback calculator', title:'防止重複觸發',
   s:[{t:'list', items:['防止重複觸發']}]},
  {id:'C4', lane:'calc', col:9, label:'紀錄與監控', ref:'文件章節 2　Lossback calculator', title:'紀錄與監控',
   s:[{t:'list', items:['記錄觸發條件、觸發時間、比分、結算結果及失敗原因','支援失敗重試、異常監控及人工查詢']}]},

  {id:'A1', lane:'api', col:6, label:'派發 Free bet', ref:'文件章節 3　Free bet API', title:'派發 Free bet API',
   s:[{t:'list', items:['新增派發 Free bet API','當賽事 Settle 時，達到 Lossback 條件，系統打 Freebet API 派發 Free bet，依照現在 Free bet 系統的邏輯']},
      {t:'next', items:['當賽事 Settle 時，達到 Lossback 條件，系統打 Bonus API 通知 Licensee 的 3rd party 獎勵 / Bonus 系統']}]},
  {id:'A2', lane:'api', col:8, label:'回收 Free bet', ref:'文件章節 3　Free bet API', title:'recall Free bet API',
   s:[{t:'list', items:['新增 recall free bet API','當賽事 reSettle 時，系統打 recall Freebet API 回收 Free bet，依照現在 Free bet 系統的邏輯']}]},

  {id:'U1', lane:'mem', col:6, label:'通知 User', ref:'文件章節 4　Member Site', title:'通知 User 得到 Free bet',
   s:[{t:'list', items:['通知 User 得到 Free bet']}]},
  {id:'U2', lane:'mem', col:7, label:'使用 Free bet', ref:'文件章節 4　Member Site', title:'使用 Free bet',
   s:[{t:'list', items:['Free bet 的使用依照現有的邏輯和流程']}]},

  {id:'R1', lane:'rep', col:9, label:'Campaign report', ref:'文件章節 1.5　Review Campaign report', title:'Review Campaign report',
   s:[{t:'note', text:'報表的資料可見範圍須依 Saba Operations 與 Licensee 權限區隔。'},
      {t:'list', items:['活動名稱、活動期間及活動狀態','Licensee、站點、運動、聯賽、賽事及盤口','適用會員數及參與會員數','Lossback 的場數及金額','觸發 Freebet 的張數及金額','Turnover、GGR 及 Margin','報表篩選及 CSV 匯出']}]}
];

const ORDER = ['O1','L1','L2','L3','M1','M2','N1','C1','C2','C3','C4','A1','A2','U1','U2','R1'];

const EDGES = [
  {a:'O1',b:'L2',k:'v'},
  {a:'L1',b:'L2',k:'h'},
  {a:'L2',b:'L3',k:'h'},
  {a:'L3',b:'M1',k:'dr'},
  {a:'M1',b:'M2',k:'h',label:'通過'},
  {a:'M1',b:'L1',k:'back',label:'退回'},
  {a:'M2',b:'C1',k:'v'},
  {a:'C1',b:'C2',k:'h'},
  {a:'C2',b:'A1',k:'v'},
  {a:'A1',b:'U1',k:'v'},
  {a:'U1',b:'U2',k:'h'},
  {a:'C4',b:'R1',k:'v'}
];

/* ---------- Build flow ---------- */
const flow = document.getElementById('flow');
const laneIndex = {};
LANES.forEach((l,i)=>{
  laneIndex[l.id]=i+1;
  const band=document.createElement('div');
  band.className='band';
  band.style.gridRow=i+1;
  flow.appendChild(band);
  const lab=document.createElement('div');
  lab.className='lane-label';
  lab.style.gridRow=i+1;
  lab.style.setProperty('--lc',l.color);
  lab.innerHTML='<b>'+l.name+'</b><span>'+l.sub+'</span>';
  flow.appendChild(lab);
});
const svgNS='http://www.w3.org/2000/svg';
const svg=document.createElementNS(svgNS,'svg');
svg.setAttribute('class','edges');
svg.setAttribute('aria-hidden','true');
svg.innerHTML='<defs>'+
 '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8796A5"/></marker>'+
 '<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B87414"/></marker></defs>';
flow.appendChild(svg);

const nodeEl={};
const laneById=Object.fromEntries(LANES.map(l=>[l.id,l]));
NODES.forEach(n=>{
  const b=document.createElement('button');
  b.className='node'+(n.rule?' rule':'')+(n.decision?' decision':'');
  b.type='button';
  b.textContent=n.label;
  b.dataset.id=n.id;
  b.setAttribute('aria-pressed','false');
  b.style.gridRow=laneIndex[n.lane];
  b.style.gridColumn=n.col+1;
  b.style.setProperty('--lc',laneById[n.lane].color);
  b.addEventListener('click',()=>openNode(n.id));
  flow.appendChild(b);
  nodeEl[n.id]=b;
});

function box(el){
  const f=flow.getBoundingClientRect(), r=el.getBoundingClientRect();
  return {l:r.left-f.left,r:r.right-f.left,t:r.top-f.top,b:r.bottom-f.top,cx:(r.left+r.right)/2-f.left,cy:(r.top+r.bottom)/2-f.top};
}
function drawEdges(){
  svg.querySelectorAll('.e').forEach(e=>e.remove());
  EDGES.forEach(e=>{
    const A=box(nodeEl[e.a]), B=box(nodeEl[e.b]);
    let d, lx, ly, back=e.k==='back';
    if(e.k==='h'){ d=`M${A.r} ${A.cy} L${B.l-2} ${B.cy}`; lx=(A.r+B.l)/2; ly=A.t-7; }
    else if(e.k==='v'){
      if(B.cy>A.cy){ d=`M${A.cx} ${A.b} L${B.cx} ${B.t-2}`; ly=(A.b+B.t)/2; }
      else { d=`M${A.cx} ${A.t} L${B.cx} ${B.b+2}`; ly=(A.t+B.b)/2; }
      lx=A.cx+8;
    }
    else if(e.k==='dr'){ d=`M${A.cx} ${A.b} L${A.cx} ${B.cy} L${B.l-2} ${B.cy}`; lx=A.cx+8; ly=(A.b+B.cy)/2; }
    else { const yy=A.b+14; d=`M${A.cx} ${A.b} L${A.cx} ${yy} L${B.cx} ${yy} L${B.cx} ${B.b+2}`; lx=(A.cx+B.cx)/2; ly=yy-6; }
    const p=document.createElementNS(svgNS,'path');
    p.setAttribute('class','e');
    p.setAttribute('d',d);
    p.setAttribute('fill','none');
    p.setAttribute('stroke',back?'#B87414':'#8796A5');
    p.setAttribute('stroke-width','2');
    if(back) p.setAttribute('stroke-dasharray','7 5');
    p.setAttribute('marker-end',back?'url(#ahb)':'url(#ah)');
    svg.appendChild(p);
    if(e.label){
      const t=document.createElementNS(svgNS,'text');
      t.setAttribute('class','e');
      t.setAttribute('x',lx); t.setAttribute('y',ly);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','13');
      t.setAttribute('font-weight','700');
      t.setAttribute('fill',back?'#B87414':'#33414F');
      t.setAttribute('stroke','#fff'); t.setAttribute('stroke-width','4'); t.setAttribute('paint-order','stroke');
      t.textContent=e.label;
      svg.appendChild(t);
    }
  });
}
window.addEventListener('resize',drawEdges);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawEdges);
requestAnimationFrame(drawEdges);

/* ---------- Drawer ---------- */
const drawer=document.getElementById('drawer');
const dBody=document.getElementById('d-body');
let current=null;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function openNode(id){
  const n=NODES.find(x=>x.id===id); if(!n) return;
  current=id;
  Object.values(nodeEl).forEach(b=>b.setAttribute('aria-pressed','false'));
  nodeEl[id].setAttribute('aria-pressed','true');
  const lane=laneById[n.lane];
  drawer.style.setProperty('--lc',lane.color);
  document.getElementById('d-pill').textContent=lane.name;
  document.getElementById('d-title').textContent=n.title;
  document.getElementById('d-ref').textContent=n.ref;
  let h='';
  n.s.forEach(s=>{
    if(s.t==='list'){
      if(s.h) h+='<h3>'+esc(s.h)+'</h3>';
      h+='<ul>'+s.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';
    } else if(s.t==='ex'){
      h+='<div class="example"><b>'+esc(s.title||'範例')+'</b>'+esc(s.text)+'</div>';
    } else if(s.t==='next'){
      h+='<div class="next"><b>Next phase</b>'+s.items.map(esc).join('<br>')+'</div>';
    } else if(s.t==='note'){
      h+='<div class="example"><b>說明</b>'+esc(s.text)+'</div>';
    } else if(s.t==='rules'){
      h+='<button class="linkbtn" data-act="rules">'+esc(s.label)+'</button>';
    } else if(s.t==='goto'){
      h+='<button class="linkbtn" data-act="goto" data-id="'+s.id+'">'+esc(s.label)+'</button>';
    }
  });
  dBody.innerHTML=h;
  dBody.scrollTop=0;
  const i=ORDER.indexOf(id);
  document.getElementById('d-count').textContent=(i+1)+' / '+ORDER.length;
  document.getElementById('d-prev').disabled=i<=0;
  document.getElementById('d-next').disabled=i>=ORDER.length-1;
  drawer.style.top=document.querySelector('header').getBoundingClientRect().bottom+'px';
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  Object.values(nodeEl).forEach(b=>b.setAttribute('aria-pressed','false'));
  const was=current; current=null;
  if(was&&nodeEl[was]) nodeEl[was].focus();
}
function step(d){
  if(!current){ openNode(ORDER[0]); return; }
  const i=ORDER.indexOf(current)+d;
  if(i>=0&&i<ORDER.length) openNode(ORDER[i]);
}
document.getElementById('d-close').addEventListener('click',closeDrawer);
document.getElementById('d-prev').addEventListener('click',()=>step(-1));
document.getElementById('d-next').addEventListener('click',()=>step(1));
dBody.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.act==='rules'){ closeDrawer(); showView('rules'); }
  if(b.dataset.act==='goto'){ openNode(b.dataset.id); }
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('view-flow').classList.contains('hidden')) return;
  if(e.key==='Escape'&&current){ closeDrawer(); }
  else if(e.key==='ArrowRight'&&current){ e.preventDefault(); step(1); }
  else if(e.key==='ArrowLeft'&&current){ e.preventDefault(); step(-1); }
});

/* ---------- Tabs and rules ---------- */
function showView(v){
  document.getElementById('view-flow').classList.toggle('hidden',v!=='flow');
  document.getElementById('view-rules').classList.toggle('hidden',v!=='rules');
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===v)));
  if(v==='flow') requestAnimationFrame(drawEdges);
  else if(current) closeDrawer();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showView(t.dataset.view)));

function showRule(){
  let h='<h2 class="rtitle">Lossback 計算規則</h2><p class="rdesc">當賽事 Settle 時，依下列規則判定 Lossback 條件。</p>';
  h+='<table><thead><tr><th>步驟</th><th>規則</th></tr></thead><tbody>';
  [['淨虧損','淨虧損 = 指定賽事之總有效投注額 - 總派彩金額（計算結果為負值）。'],
   ['門檻判定','淨虧損絕對值 ≥ 低消。'],
   ['回饋 Freebet','回饋 Freebet = min(淨虧損絕對值 × 回饋百分比, 回饋 Freebet 上限)。']
  ].forEach(r=>{ h+='<tr><td class="scn">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'; });
  h+='</tbody></table>';
  h+='<h2 class="rtitle" style="margin-top:28px">Trigger 設定參數</h2>';
  h+='<p class="rdesc">Lossback 只有一個級數，輸入各級的下列三項。</p>';
  h+='<table><tbody><tr><td class="scn">低消</td><td></td></tr><tr><td class="scn">回饋百分比</td><td></td></tr><tr><td class="scn">回饋 Freebet 上限</td><td></td></tr></tbody></table>';
  h+='<div class="next" style="margin-top:14px"><b>Next phase</b>建立 Lossback 分級，最多可以分 10 級</div>';
  h+='<h2 class="rtitle" style="margin-top:28px">Free bet 使用限制</h2>';
  h+='<p class="rdesc">呈現 Freebet 的使用限制（例如：可用在哪些聯賽），可參考現有 Freebet 系統的做法。</p>';
  h+='<p class="rnote">排除之 Bet Type 與 Bet slip status 見文件 1.3。<button type="button" id="goto-b3">查看不適用注單</button></p>';
  document.getElementById('rule-body').innerHTML=h;
  document.getElementById('goto-b3').addEventListener('click',()=>{ showView('flow'); openNode('N1'); });
}
showRule();
</script>
</body>
</html>
